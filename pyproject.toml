[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mountainash-auth-client"
version = "26.5.0"
description = "Client-side authentication for the mountainash ecosystem"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "pyaml",
]

[project.optional-dependencies]
oauth1 = ["authlib>=1.3.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/mountainash_auth_client"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "FA", "TCH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
