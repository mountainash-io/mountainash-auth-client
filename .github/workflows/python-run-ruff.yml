name: Ruff

on:
  pull_request:
    paths:
      - src/mountainash_auth_client/**
      - tests/**
      - examples/**
      - pyproject.toml
      - hatch.toml
      - .github/workflows/python-run-ruff.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Hatch
        run: python -m pip install --disable-pip-version-check --no-input hatch==1.18.2

      - name: Create Ruff environment
        run: hatch env create ruff

      - name: Run Ruff
        run: hatch run ruff:ruff check src tests tools examples
