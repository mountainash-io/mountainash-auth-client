[envs.test]
installer = "uv"
dependencies = [
    "pytest>=8.0",
    "pytest-cov",
]

[envs.test.scripts]
test = "pytest {args}"
test-target = "pytest {args} -v"

[envs.ruff]
detached = true
dependencies = ["ruff"]

[envs.ruff.scripts]
check = "ruff check src/ tests/"
fix = "ruff check --fix src/ tests/"
